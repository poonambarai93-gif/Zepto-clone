<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zepto-10 Minutes Delivery</title>
</head>
<link rel="stylesheet" href="Style.css">
<link rel="icon" type= "image/logo" href="image/zepto-logo">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <!-- !Navbar -->
    <nav>
        <section id="nav1">
            <aside id="logo-address">
              <div id="logo">Z</div>
              <div id="address">
              <p>Delivery in<span>10 mins</span></p>
              <p id="location">
                <i class="fa-solid fa-location-dot"></i>Select Address</p>
              </div>
            </aside>
            <aside id="links">
                <a href="#" class="active">Home</a>
                <a href="./Product.html">Products</a>
            </aside>
            <aside id="user-cart">
                <i class="fa-regular fa-user"></i>
                <i class="fa-solid fa-cart-shopping"></i>
            </aside>
        </section>
    </nav>
    <!--!Header  -->
    <header>
        <div id="banner-container">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTjD402HmulqVqB4aOhktXITsWz3NEXDZz0xDqxjP3IpQ&s=10" alt="banner1">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuR0GJR7evuclFLQHEwmYQmXqId18NI_deQ0n3eQNKFQ&s=10" alt="banner2">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgL0GEfvskPkWhdZyJMiLVXfw2NFc2ueAEfsPQlRhFHQ&s" alt="banner3"> 
        </div>
    </header>
    <!--!CATEGORY  -->
    <section id="category">
        <article id="category-title">
            <h2>Shop by Category</h2>
        </article>
        <article id="category-items">
        </article>
    </section>
    <!--!HIGHLIGHTS -->
    <section id="highlights">
        <div class="highlights-container one">
            <p class="highlights-icons">🚴</p>
            <p class="highlight-title">Free Delivery</p>
            <p class="highlight-description">On order above ₹149/-</p>
        </div>
        <div class="highlights-container two">
            <p class="highlights-icons">⚡</p>
            <p class="highlight-title">10 mins delivery</p>
            <p class="highlight-description">Lightning fast</p>
        </div>
        <div class="highlights-container three">
            <p class="highlights-icons">💸</p>
            <p class="highlight-title">Best Prices</p>
            <p class="highlight-description">Directly from farms</p>
        </div>
        <div class="highlights-container four">
            <p class="highlights-icons">🛍️</p>
            <p class="highlight-title">Wide assortment</p>
            <p class="highlight-description">5000+ products</p>
        </div>
    </section>
    <!--!FOOTER-->
    <footer>
        <h2>Zepto</h2>
        <p> &copy;2026|10 Minutes Delivery</p>
        <p>194 product across 24 categories.</p>
    </footer>
    <script src="Script.js"></script>
</body>
</html>
